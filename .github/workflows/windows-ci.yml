name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build, test, and run native analysis
        shell: pwsh
        run: ./build.ps1 -Analyze

      - name: Run offline self-test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath './build/Civ6_2K_Online_Fix.exe' -ArgumentList '--self-test' -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Offline self-test failed with exit code $($process.ExitCode)."
          }

      - name: Exercise release packaging and checksums
        shell: pwsh
        run: |
          ./package.ps1
          $identity = Get-Content ./version.json -Raw | ConvertFrom-Json
          $package = "./dist/$($identity.PackageBaseName)_$($identity.Version)"
          & "$package/verify_hashes.ps1"
          $sourceRoot = [IO.Path]::GetFullPath("$package/source")
          $expected = @(git ls-files)
          $actual = @(Get-ChildItem $sourceRoot -File -Recurse -Force | ForEach-Object {
            [IO.Path]::GetRelativePath($sourceRoot, $_.FullName).Replace('\', '/')
          })
          if (Compare-Object $expected $actual) {
            throw 'Packaged source does not contain the exact tracked source file set.'
          }

      - name: Rebuild from packaged source
        shell: pwsh
        run: |
          $identity = Get-Content ./version.json -Raw | ConvertFrom-Json
          $package = "./dist/$($identity.PackageBaseName)_$($identity.Version)"
          Push-Location "$package/source"
          try {
            ./build.ps1 -Analyze
            ./package.ps1 -OutputName source-check -AllowNonReleaseName -NoArchive
            ./dist/source-check/verify_hashes.ps1
          }
          finally {
            Pop-Location
          }
          foreach ($name in @('Civ6_2K_Online_Fix.exe', 'Civ6-Start.exe')) {
            $packagedHash = (Get-FileHash "$package/$name" -Algorithm SHA256).Hash
            $rebuiltHash = (Get-FileHash "$package/source/build/$name" -Algorithm SHA256).Hash
            if ($rebuiltHash -ne $packagedHash) {
              throw "Packaged-source rebuild differs for ${name}: $packagedHash != $rebuiltHash"
            }
          }

      - name: Upload verified release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 14
